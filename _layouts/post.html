---
layout: default
---

<article class="post">
  <header class="post-header">
    <h1>{{ page.title }}</h1>

    {% if page.date %}
      <time class="post-meta" datetime="{{ page.date | date_to_xmlschema }}">
        {{ page.date | date: "%d/%m/%Y" }}
      </time>
    {% endif %}
  </header>

  <div class="post-content">
    {{ content }}
  </div>

  <nav class="post-nav">
    <a href="{{ '/' | relative_url }}">← Todas as notas</a>
  </nav>
</article>
